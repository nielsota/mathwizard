# Production Docker Compose (Cloudflare Tunnel)
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Put TUNNEL_TOKEN in env.prod. In the Cloudflare dashboard, point the
# public hostname at http://app:8080 (Docker DNS, not localhost).
# Host port 8000 is not used; the app listens on 8080 inside the compose network.

services:
  app:
    build: .
    env_file:
      - env.prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"
      WEB__COOKIE_SECURE: "true"
    command: uv run uvicorn mathwizard.app.main:app --host 0.0.0.0 --port 8080
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    env_file:
      - env.prod
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
