parts:
- points: 4
  text: Stel een vergelijking op van de raaklijn \(l\) aan de grafiek van \(f\) in \(P\). De lijn \(l\) snijdt de \(x\)-as in punt \(A\). Bepaal exact de coördinaten van \(A\).
- points: 4
  text: \(V\) is het vlakdeel dat wordt ingesloten door de grafiek van \(f\) en het lijnstuk \(OP\). Bereken exact de oppervlakte van \(V\), uitgedrukt in \(p\).
- points: 5
  text: Bewijs dat de oppervlakte van driehoek \(OAP\) anderhalf keer zo groot is als de oppervlakte van \(V\).
stem: De functie \(f\) is gegeven door \(f(x) = x^2\). Het punt \(P(p, p^2)\) met \(p > 0\) ligt op de grafiek en \(O\) is de oorsprong.
title: Raaklijn en oppervlakteverhouding
