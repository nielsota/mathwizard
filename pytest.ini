[pytest]
# Pytest configuration
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    db: uses SQLAlchemy and a temporary SQLite database

# Show extra test summary info
addopts =
    --verbose
    --strict-markers
    --tb=short

# Async support
asyncio_mode = auto

