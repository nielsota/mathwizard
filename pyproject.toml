[project]
name = "mathwizard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Niels Ota", email = "ota.niels@bcg.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.1",
    "fastapi>=0.138.0",
    "uvicorn>=0.32.1",
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
    "pydantic-settings>=2.0.0",
    "pwdlib[bcrypt]>=0.3.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.16.5",
    "ty>=0.0.76",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "FAST",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["mathwizard"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "migrations"]
